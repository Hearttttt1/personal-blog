name: 部署博客

on:
  push:
    branches: [main]
  repository_dispatch:
    types: [sveltia-cms-publish]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 获取仓库内容
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: 安装依赖
        run: npm ci
      - name: 生成静态博客
        run: npx quartz build
      - name: 安装管理后台构建依赖
        run: npm install --no-save --package-lock=false @sveltia/cms@0.221.8 vite@8.2.0
      - name: 构建管理后台
        run: npx --no-install vite build --config admin/vite.config.mjs
      - name: 加入管理后台配置
        run: cp admin/config.yml public/admin/config.yml
      - name: 上传网页
        uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - name: 发布到 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
